name: Checks

# Runs every check on every push and pull request. Nothing is merged or
# deployed while any of them fails.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, rule tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: Phone and desktop tests (iPhone, Android and desktop browsers)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      # Sign in and freeze (W2) are tested against a real database: a
      # throwaway local Postgres with every app migration, never the real
      # Supabase project.
      - name: Start a throwaway database (never the real project)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16-pgtap
          sudo systemctl start postgresql
          sudo -u postgres psql -c "alter user postgres password 'postgres'"
      - run: npm run e2e
        env:
          E2E_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cyberx_web_e2e
      - run: npm run check:dev
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
